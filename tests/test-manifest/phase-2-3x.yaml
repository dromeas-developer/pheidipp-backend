    for HR values [140, 145, 150]. The natural-training consistency check in app/services/threshold_detection_service.py
    is any(abs(hr - median_hr) > EASY_RUN_HR_TOLERANCE_BPM for hr in sorted_hrs)
    where EASY_RUN_HR_TOLERANCE_BPM = 5.0 — a STRICT greater-than. With median 145,
    max deviation abs(150 - 145) = 5.0 is NOT > 5.0, so the values pass the consistency
    check. Fix: widen the spread to [130, 145, 165] (median 145, max deviation 20
    bpm — unambiguously above the 5 bpm threshold). Affects threshold_detection_service_end_to_end.

