  coverage_delta: 'DevOps report triage (2026-07-13) — 51 of 194 tests failed. Categorised
    as a mix of test-pack issues (fixed) and implementation bugs (routed to p-coder
    with detailed analysis). No infrastructure changes were needed; the MOCKING_CONTRACT.md
    was not modified because none of the listed Known Anti-Patterns matched these
    failures.

    **Test-pack fixes (5 issues, 1 test removed, 1 factory added, ~20 tests touched):**
    1. **Bayesian fixture date mismatch (4 tests)**: the unit tests'' `_state()` default
    `last_observation_date` is `2026-05-01` and the default `_observation()` `obs_date`
    is `2026-06-15` — a 45-day gap that decays the prior weight via the 42-day time
    constant. Four tests (test_posterior_mean_exact_when_weights_equal, test_new_total_weight_is_decayed_plus_observation,
    test_uncertainty_above_floor_when_evidence_moderate, test_prior_dominates_when_weights_equal)
    expected no-decay math and asserted same-day results. Pinned `last_observation_date=''2026-06-15''`
    on the `_state()` calls in those four tests so the dates match the observation
    date. 2. **Integration test FK violation (`activity_id=uuid.uuid4()`)**: the `_observation()`
    helper defaulted `activity_id` to a fresh `uuid.uuid4()`, which violated the `physiology_measurements.activity_id`
    foreign key (the column is nullable, but a non-null value must reference a real
    `activities.id`). Changed the default to `None` in all 4 integration test files,
    and added a `make_activity` factory in `tests/utils/factories.py` for tests that
    explicitly need a real `Activity` reference (idempotency dedup tests, the `test_measurement_row_persists_for_single_observation`
    test). 3. **Behaviour test missing `AthletePhysiology` row**: `http_register`
    only creates `Athlete + AthleteAuth + AthleteProfile` — the `AthletePhysiology`
    row is bootstrapped by the onboarding service (separate sub-phase, out of P2 scope).
    The behaviour tests called `apply_observations` without first creating the row,
    raising `MissingAthletePhysiologyError`. Added an `_ensure_physiology_row` helper
    in `test_physiology_update_user_journey.py` and call it after every `http_register`
    (7 test bodies touched). 4. **`test_updated_at_changes_even_with_no_column_mutations`
    removed**: this test asserted `updated_at` advances on a `flush()` with no column
    mutations. SQLAlchemy''s `onupdate=` hook only fires when an actual `UPDATE` statement
    is issued — i.e. when at least one column is mutated. A no-op call does not issue
    an UPDATE; the hook does NOT fire. The test was asserting the wrong behaviour;
    the correct semantics are pinned by `test_updated_at_changes_after_update` (a
    mutated-column call DOES fire the hook). Replaced the test with a NOTE comment
    explaining the removal.

    **Implementation bugs (routed to p-coder — NOT fixed by Test Architect):** 1.
    **`_source_value()` returns the wrong string format** — the function is `return
    str(source)` for any source value. For `class MeasurementSource(str, Enum)`, `str(enum_member)`
    returns `''ClassName.MEMBER_NAME''` (e.g. `''MeasurementSource.TRAINING_RR_INFLECTION''`)
    rather than the `.value` string (`''training_rr_inflection''`). Affects every
    observation whose source is a `MeasurementSource` enum member: the `dominant_source`
    field on `AthletePhysiology.lt1/l2/cp/max_hr` JSONB and the `dominant_sources`
    dict in the `physiology_updated` event payload. Verified with `.venv/bin/python`
    — the enum behaviour is the same on Python 3.11 (the project''s runtime). The
    fix is one line: `return source.value if isinstance(source, MeasurementSource)
    else str(source)`. 2. **`apply_observations` loop does not accumulate state across
    multiple observations of the same parameter in a single call**. The implementation
    reads `current_state` from `physiology` on every iteration via `_get_parameter_state(physiology,
    obs.parameter)`, but `physiology` is only mutated AFTER the loop (via `_apply_updated_states`).
    So 4 observations of the same parameter in a single call all see the ORIGINAL
    prior_weight; only the last iteration''s `working_state[parameter] = new_state`
    survives the dict-overwrite, and the posterior reflects exactly 1 observation''s
    contribution rather than 4. Breaks the confidence transition tests (4 observations
    should reach `prior_weight=4.0`, but instead `prior_weight=1.0` after the loop).
    The fix is in `apply_observations` — use `working_state.get(obs.parameter, current_state)`
    as the next iteration''s `current_state`, OR update `working_state[obs.parameter]`
    BEFORE reading the next observation''s `current_state`.

    **Test count after triage**: 172 collected cleanly via `bash scripts/pytest.sh
    --collect-only` (down from 194 — the `test_updated_at_changes_even_with_no_column_mutations`
    test was removed and... actually no, the count is 172 because the removed test
    was a single test; the test count of 194 in the DevOps report included tests in
    the `feature` group plus `smoke` and `regression` selections not relevant to this
    triage). Collection time unchanged (0.13s).

    **No validation status change** — all 30 features in this sub-phase remain at
    `validation.implemented = true`, `validation.executable = true`, `validation.passed
    = false` (set by DevOps during the failed execution). The next DevOps run will
    re-execute and re-evaluate `executable`/`passed` based on the test-pack fixes;
    the two implementation bugs above will still cause failures until p-coder fixes
    the implementation. '
