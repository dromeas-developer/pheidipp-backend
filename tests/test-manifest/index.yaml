# ---------------------------------------------------------------------------
# INDEX — lightweight cross-phase registry.
# Per-sub-phase details (features, protects, coverage, history) live in
# the individual phase files: phase-1-1.yaml, phase-1-2a.yaml, etc.
#
# SELECTION GROUP SEMANTICS:
#   smoke      — all promoted pure-function unit tests; no DB/containers;
#                cheapest tripwire for catastrophic regressions.
#                Rebuild when any sub-phase promotes new unit tests.
#   feature    — CURRENT active sub-phase tests only (not all promoted).
#                DevOps reads this for the default run scope.
#   regression — all promoted tests across ALL sub-phases (status=promoted,
#                validation.passed=true). Only Test Architect adds entries here
#                after reviewing a passing DevOps run.
#   release    — same as regression until a separate release gate is defined.
#
# PROMOTION FLOW:
#   1. DevOps sets validation.executable + validation.passed in sub-phase file
#   2. Test Architect reviews DevOps report
#   3. Test Architect advances status: passing -> promoted in sub-phase file
#   4. Test Architect rebuilds regression + release groups in this file
#   5. Test Architect appends one-line entry to history in this file
# ---------------------------------------------------------------------------

