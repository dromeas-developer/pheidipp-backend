    with stale JSONB attributes after the `await db_session.commit()` boundary, causing
    `fresh.cp is None` (or other stale values) assertions to fail despite the prior
    `repo.update_in_place()` having persisted a non-null value.  The `.scalars().all()[0]`
    path constructs a fresh instance from result rows, bypassing the identity map.

    No test count change (48 tests still collected cleanly via `bash scripts/pytest.sh
    --collect-only` in 0.13s). No validation status change (already at `validation.implemented
    = true` from prior generation; `validation.executable` and `validation.passed`
    remain DevOps-owned).

    Lesson recorded in `tests/README.md` under "Dated Lessons (2026-07-13)" and added
    to `tests/MOCKING_CONTRACT.md` "Known Anti-Patterns" table.  Test pack "Recurring
    Infrastructure Risk" section updated.  This is a reusable failure class — any
    future integration test doing a post-commit read of a JSONB-mutated row is at
    risk.  If a second integration test author encounters this pattern, the fix should
    move into a shared conftest helper (e.g. `fresh_row(session, model, id)`). '
