    context (MissingGreenlet). Fix: add .execution_options(populate_existing=True)
    to the SELECT so SQLAlchemy bypasses the identity map and rebuilds the instance
    from the result row. The capture-scalar pattern (round 2) protects the WHERE clause;
    populate_existing=True protects attribute access on the returned row. The two
    fixes compose. Affects physiology_measurement_repository_persistence.

