features:
  phase-1-4-plan-generation-templates:
    status: promoted
    plan: "docs/implementation/phase-1/phase-1-4-p1-plan-generation.md"
    owned_by_plan:
      - "phase-1-4-p1-plan-generation"
    description: >-
      Pure-Python deterministic templates driving PlanGenerationService:
      race_event phase proportions (40% base / 30% threshold / 15%
      race_specific + fixed 2-week taper + 1-week race-week),
      training-length gate, experience-level mapping, structural
      session-type sets (QUALITY_SESSION_TYPES,
      SANDWICHED_SESSION_TYPES), checkpoint scheduling algorithm.
    protects:
      - "Service is pure Python — no LLM, no external API calls"
      - "evaluate_training_length_gate returns action='proceed' for valid inputs"
      - "evaluate_training_length_gate returns action='propose_intermediate' (gate_reason=goal_too_far) when weeks_until_goal > per-(event, experience) threshold"
      - "evaluate_training_length_gate returns action='propose_shorter_goal' (gate_reason=fitness_insufficient_for_distance) for short horizons with fitness_level <= 2"
      - "derive_experience_level maps < 2 years -> novice, 2..5 -> intermediate, > 5 -> experienced"
      - "QUALITY_SESSION_TYPES includes THRESHOLD, VO2MAX, LONG_RUN and other heavy types"
      - "SANDWICHED_SESSION_TYPES is exactly {THRESHOLD, VO2MAX} and is a subset of QUALITY_SESSION_TYPES"
      - "allocate_race_event_phases produces five phases in canonical order when total_weeks > 3"
      - "allocate_race_event_phases sums to total_weeks for every total in {4, 8, 12, 16, 20, 24, 30}"
      - "allocate_race_event_phases reserves exactly 2 weeks for TAPER and 1 week for RACE_WEEK"
      - "allocate_race_event_phases falls back to TAPER + RACE_WEEK when total_weeks <= 3"
      - "allocate_race_event_phases raises ValueError on total_weeks <= 0"
      - "to_phase_definition_record carries canonical keys (phase, objectives, weeks, distribution, specificity, approach, recovery_cycle)"
      - "to_phase_definition_record sets approach='linear' and recovery_cycle='frequent' for TAPER and RACE_WEEK phases"
      - "schedule_checkpoints produces no two checkpoints in the same week"
      - "schedule_checkpoints sorts CheckpointRecord rows by week_number ascending"
      - "schedule_checkpoints includes at least one CALIBRATION on phase transitions when twin metric confidence is low"
      - "schedule_checkpoints includes BENCHMARK + PROGRESS_REVIEW for 16+ week plans"
      - "schedule_checkpoints includes RACE_SIMULATION when goal_event_type is a race distance and the plan is long enough"
    impacts:
      - "phase-1-4-plan-generation-service"
      - "phase-1-4-plan-router"
    execution_prerequisites:
      migrations: false
      seed_data: false
      external_services: []
    validation:
      implemented: true
      executable: true
      passed: true
