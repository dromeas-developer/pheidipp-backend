      api: []
      behaviour: []
      release: []

  phase-1-4-plan-generation-service:
    status: promoted
    plan: "docs/implementation/phase-1/phase-1-4-p1-plan-generation.md"
    owned_by_plan:
      - "phase-1-4-p1-plan-generation"
    description: >-
      Atomic plan-generation transaction for race_event and
      target_performance goals: gates to entry conditions, builds the
      full plan hierarchy (TrainingPlan -> WeeklyPlan[] ->
      WeeklySession[] -> PlannedSession[] -> Checkpoint[]), supersedes
      any prior active plan, persists the training_plan_generated
      event in the same transaction, and commits exactly once.
      OnboardingService.complete_onboarding invokes generate_plan
      atomically at the end of onboarding so onboarding and plan
      generation commit together.
    protects:
      - "PlanGenerationService.generate_plan is the sole writer of the plan hierarchy"
      - "Race-event plan generates the documented phase sequence: aerobic_base -> threshold_build -> specific_endurance -> taper -> race_week"
      - "Phase date ranges are non-overlapping, ordered, contiguous from plan_start to goal_event_date"
      - "WeeklyPlan and PlannedSession rows cover the full duration with one WeeklyPlan per (training_plan_id, week_number)"
      - "All PlannedSession rows start with status='scheduled'"
      - "All Checkpoint rows start with status='scheduled'"
      - "No two consecutive quality sessions appear in any week unless they share a block_id"
      - "Long run is always followed by rest or recovery_run"
      - "Threshold and VO2max sessions are always sandwiched between easy/rest days"
      - "For a long plan: at least one calibration, one benchmark, one progress_review checkpoint"
      - "Generate-plan-then-generate-again supersedes the previous plan atomically (status=SUPERSEDED, superseded_at populated) and a new active plan is left in place (one-active-per-goal)"
      - "Old plans are never deleted — superseded_at is the only mutation"
      - "Generating for an unsupported goal_type raises InvalidGoalTypeError"
      - "Generating with a too-far-out goal raises TrainingLengthGateError (gate_reason=goal_too_far)"
      - "Generating with missing TwinState raises PlanGenerationError"
      - "Generating with a non-existent athlete raises PlanGenerationError"
      - "training_plan_generated event persists to SystemEvent + SystemEventOutbox (status=PENDING) in the same transaction"
      - "event payload carries training_plan_id, training_goal_id, phase_definitions_count, total_weeks, supersedes_plan_id, trigger"
    impacts:
      - "phase-1-4-plan-generation-templates"
      - "phase-1-4-plan-repositories"
      - "phase-1-4-plan-event-contract"
      - "phase-1-4-plan-router"
      - "phase-1-3-onboarding-service-transaction"
      - "phase-1-3-onboarding-endpoints"
    execution_prerequisites:
      migrations: false
      seed_data: false
      external_services: []
    validation:
      implemented: true
      executable: true
      passed: true
    tests:
      unit: []
      integration:
        - path: "tests/integration/test_plan_generation_service.py"
          owner: "phase-1-4-p1-plan-generation"
      api: []
      behaviour: []
      release: []

  phase-1-4-plan-router:
    status: promoted
    plan: "docs/implementation/phase-1/phase-1-4-p1-plan-generation.md"
    owned_by_plan:
      - "phase-1-4-p1-plan-generation"
    description: >-
      Four read-only endpoints mounted on plan_router behind
      ``require_self``: GET /athletes/{id}/plan, /plan/sessions,
      /plan/upcoming, /plan/checkpoints. All responses use Pydantic
      ``model_validate`` via ``from_attributes=True``; no ORM -> dict
      ``.dict()`` paths.
    protects:
      - "GET /plan returns TrainingPlanResponse with phases, phase_definitions, weekly_distributions, status, strategic_rationale, checkpoint_schedule"
      - "GET /plan strategic_rationale is set for race_event (and target_performance) modes"
      - "GET /plan/sessions returns list[PlannedSessionResponse] ordered by target_date ASC, session_slot ASC; every session status='scheduled'"
      - "GET /plan/sessions joins through WeeklyPlan.training_plan_id (denormalised PlannedSession.training_plan_id is not used for current-plan queries)"
      - "GET /plan/upcoming returns UpcomingSessionsResponse with the next 5 sessions from today onwards, capped at 5"
      - "GET /plan/checkpoints returns list[CheckpointResponse] joining PlannedSession -> WeeklyPlan -> TrainingPlan and ordered by target_date ASC"
      - "Every endpoint returns 404 when no active plan exists"
      - "Every endpoint returns 403 when the JWT athlete_id does not match the path parameter (require_self 403, never 404)"
      - "Every endpoint returns 401 on missing/malformed Bearer"
    impacts:
      - "phase-1-4-plan-generation-service"
      - "phase-1-1-require-self-dependency"
      - "phase-1-3-onboarding-endpoints"
    execution_prerequisites:
