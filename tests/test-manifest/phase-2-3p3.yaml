  derive_confidence_level_global:
    status: promoted
    test_type: unit
    file_scope:
    - app/services/twin_recalibration_service.py
    plan: docs/implementation/phase-2/phase-2-3-p3-twin-recalibration-pipeline.md
    owned_by_plan:
    - phase-2-3-p3-twin-recalibration-pipeline
    description: '_derive_confidence_level() derives the global confidence_level
      from the updated AthletePhysiology row using min(lt1.hr.prior_weight, lt2.hr.prior_weight)
      mapped through the 4.0 / 8.0 thresholds.

      '
    protects:
    - Both below 4.0 → LOW
    - One above 4.0, one below → LOW (weakest link)
    - Both above 4.0, below 8.0 → MEDIUM
    - Both above 8.0 → HIGH
    - No HR data → LOW
    - Lt1 null outer → LOW
    - Only lt1.hr → drives global (with min(weight, 0))
    - Only lt2.hr → drives global (with min(weight, 0))
    - Power and pace do not drive global
    impacts: []
    execution_prerequisites:
