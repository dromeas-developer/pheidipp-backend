  invariants:
    covered:
      - "Steps run in fixed order 1→7. No step may be skipped or reordered."
      - "{'Null propagation': 'artifact-removed nulls propagate through smoothing.'}"
      - "{'Resampling': 'FIT files resampled to uniform 1 Hz time series.'}"
      - "If the pipeline produces a stream shorter than 5 minutes of non-null HR data, RawSensorStream is not created."
      - "Signal cleaning failure does not block Activity creation."
      - "Activities with source = manual_entry never get RawSensorStream."
      - "If cleaning fails (stream too short, all HR artifacts), no RawSensorStream is created."
      - "Cleaned data stored in object storage is immutable."
      - "The fit_file_key on RawSensorStream is the cleaned stream key — different from Activity.fit_file_key."
      - "available_channels reflects what survived artifact removal."
      - "Activity.cleaning_pipeline_version null → non-null transition driven exclusively by the cleaning task."
      - "Activities with sport_type != running are treated as calibration_eligible = false."
      - "One RawSensorStream per Activity."
      - "Cleaned RR values that deviate more than ±20% from the rolling median are filtered out. (Phase-2.2-P2 sub-phase Exit Gate; P1 integration pack added end-to-end coverage; P2 unit-mode pack added cross-section isolation on _remove_artifacts; P2 integration-mode pack strengthened the existing end-to-end test with per-index assertions on the persisted cleaned stream and added 3 new integration tests covering the persistence-boundary contract for the filter-isolation guard, the null-propagation/window-too-small guard, and the available_channels.rr_intervals post-deviation state.)"
      - "The RR ±20% deviation filter is RR-specific — it does NOT apply to HR, power, speed, or elevation channels. (Phase-2.2-P2 testing requirement 3; unit + integration coverage.)"
