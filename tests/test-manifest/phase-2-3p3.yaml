    status: promoted
    test_type: unit
    file_scope:
    - app/services/twin_recalibration_service.py
    plan: docs/implementation/phase-2/phase-2-3-p3-twin-recalibration-pipeline.md
    owned_by_plan:
    - phase-2-3-p3-twin-recalibration-pipeline
    description: '_prior_weight_to_level() maps a prior_weight to a TwinConfidenceLevel
      using the 4.0 / 8.0 thresholds from the confidence model.

      '
    protects:
    - Zero weight → LOW
    - 3.99 → LOW (strict less than 4.0)
    - 4.0 → MEDIUM (inclusive boundary)
    - Between 4 and 8 → MEDIUM
    - 8.0 → HIGH (inclusive boundary)
    - Above 8 → HIGH
    - None → LOW
    impacts: []
    execution_prerequisites:
