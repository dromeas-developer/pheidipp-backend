    - phase-2-3-p3-twin-recalibration-pipeline
    description: '_max_confidence_level_string() applies the per-metric monotonicity
      ratchet (ADR-011) with None semantics: None previous means "no data" (not
      "low confidence"), so computed wins.

      '
    protects:
    - None previous + non-null computed → computed wins
    - None computed + non-null previous → previous preserved
    - Both None → None
    - Higher computed → computed wins
    - Lower computed → previous preserved (ratchet)
    - Equal values → previous preserved
    impacts: []
    execution_prerequisites:
