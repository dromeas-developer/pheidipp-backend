cross_phase_history:
  - date: "2026-06-25"
    plan: "phase-1-2c-p1-twin-fitness-coaching-workouts"
    tests_promoted: 15
    result: "PASS"
    details: >
      1127/1127 tests pass (157.10s). All 9 Phase-1.2c features promoted:
      enums + 7 schema entities + migration. Adds twin_states,
      athlete_physiology, athlete_fitness, coaching_messages,
      generation_events, generated_workouts, workout_steps tables and
      wires training_plans.twin_state_id FK (Phase-1.2c deferred FK).
      Round-4 cross-schema pg_constraint leak fix unblocked the
      Phase-1.2b regression run. selection.regression and
      selection.release now include all Phase-1.2c tests;
      this sub-phase adds 15 test files (7 unit + 8 integration);
      cumulative regression envelope is 60 promoted test files
