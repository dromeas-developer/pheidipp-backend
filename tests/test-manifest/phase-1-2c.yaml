coverage:
  events:
    covered: []
  invariants:
    covered:
      - "TwinTrigger values are exactly questionnaire, activity_sync, calibration, physiology_input, wellness_update"
      - "TwinConfidenceLevel values are exactly low, medium, high"
      - "MessageType values are exactly first_message, post_workout, wellness_alert, phase_transition, plan_regeneration, confidence_upgrade, cycle_check_in, weekly_summary"
      - "StepType values are exactly warmup, work, recovery, cooldown"
      - "RecoveryModifierLevel values are exactly green, amber, red"
      - "WellnessTrend values are exactly improving, stable, declining"
      - "PhysiologicalIntent values are exactly low_aerobic, high_aerobic, threshold, vo2max, neuromuscular, recovery"
      - "MeasurementSource values are exactly questionnaire_estimate, training_hr_deflection, training_rr_inflection, training_power_hr_ratio, field_test, lab_test"
      - "SignalType values are exactly power, gap, hr, description"
      - "SessionPurpose values are exactly general, race_specific, calibration"
      - "twin_states carries the documented column set"
      - "TwinState partial unique index on (athlete_id, activity_id) WHERE activity_id IS NOT NULL"
      - "Two TwinStates with same non-null activity_id raise IntegrityError"
      - "Multiple TwinStates per athlete with NULL activity_id coexist"
      - "TwinState append-only — no update()/delete() helpers on the mapper"
      - "TwinState FKs to athletes (CASCADE), training_goals (CASCADE), activities (SET NULL)"
      - "TwinState idx_twin_states_latest on (athlete_id, created_at)"
      - "TwinState metric_confidence defaults to '{}'::jsonb"
      - "athlete_physiology unique on athlete_id"
      - "Two AthletePhysiology rows for same athlete raise IntegrityError"
      - "athlete_physiology.lt1 and lt2 NOT NULL; cp/vo2max/max_hr nullable"
      - "AthletePhysiology FK to athletes CASCADES"
      - "AthletePhysiology mutable — posterior updates succeed"
      - "athlete_fitness unique on athlete_id"
      - "Two AthleteFitness rows for same athlete raise IntegrityError"
      - "AthleteFitness.aggregate NOT NULL; dimensional blocks nullable"
      - "AthleteFitness form = fitness - fatigue CHECK enforced on aggregate and each populated dimension"
      - "AthleteFitness time_constants.source bounded to population_default|individual_fitted"
      - "Invalid form value in aggregate raises IntegrityError"
      - "AthleteFitness FK to athletes CASCADES, last_activity_id SET NULL on activity deletion"
      - "CoachingMessage partial unique on (athlete_id) WHERE message_type = 'first_message'"
      - "Two first_message rows for same athlete raise IntegrityError"
      - "CoachingMessage partial unique on (activity_id) WHERE message_type = 'post_workout' AND activity_id IS NOT NULL"
      - "Two post_workout rows for same activity_id raise IntegrityError"
      - "CoachingMessage content must be non-empty (CHECK)"
      - "CoachingMessage FKs to athletes/twin_states CASCADE, activity_id SET NULL"
      - "CoachingMessage append-only — no update()/delete() helpers on the mapper"
      - "GenerationEvent failure_reason IS NOT NULL iff success=false (CHECK)"
      - "GenerationEvent token counts and latency_ms non-negative (CHECK)"
      - "GenerationEvent FK to athletes CASCADES"
      - "GenerationEvent append-only — no update()/delete() helpers on the mapper"
      - "generated_workouts UNIQUE on (planned_session_id, generation_date)"
      - "Duplicate (planned_session, generation_date) raises IntegrityError"
      - "GeneratedWorkout CHECK enforces theoretical_targets and adjusted_targets are JSONB objects"
      - "GeneratedWorkout recovery_modifier_level bounded to green|amber|red (CHECK)"
      - "GeneratedWorkout FKs to planned_sessions/twin_states CASCADE"
      - "GeneratedWorkout append-only — no update()/delete() helpers on the mapper"
      - "workout_steps UNIQUE on (generated_workout_id, step_order)"
      - "Duplicate (workout, step_order) raises IntegrityError"
      - "WorkoutStep step_order >= 1 (CHECK)"
      - "WorkoutStep duration_seconds non-negative (CHECK)"
      - "WorkoutStep description non-empty (CHECK)"
      - "WorkoutStep physiological_intent NOT NULL"
      - "WorkoutStep session_purpose defaults to 'general'"
      - "WorkoutStep FK to generated_workouts CASCADES"
      - "alembic upgrade head on a fresh database succeeds (rc=0)"
      - "Phase-1.2c migration down_revision chains from Phase-1.2b head (1b9e9026db1e)"
      - "Phase-1.2c migration revision equals 79dc97d4e433"
      - "Migration creates all 7 documented tables"
      - "Migration never drops Phase-1.1/1.2a/1.2b tables"
      - "Migration emits all partial unique indexes (TwinState activity, CoachingMessage first_message/post_workout)"
      - "Migration emits all CHECK constraints (form invariants, failure_reason consistency, target objects, step constraints)"
      - "training_plans.twin_state_id gains FK to twin_states.id"
