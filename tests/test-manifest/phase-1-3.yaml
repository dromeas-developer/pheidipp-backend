coverage:
  events:
    covered:
      - "onboarding_completed (payload + outbox row in pending status)"
  invariants:
    covered:
      - "Atomic onboarding transaction (single commit, no orphan rows on rollback)"
      - "Re-onboarding rejected (409 via OnboardingAlreadyCompleteError)"
      - "Single active training goal per athlete (partial unique index to 409 via TrainingGoalConflictError)"
      - "Goal-type whitelist (only race_event | target_performance accepted)"
      - "Timezone validated against IANA tz database (zoneinfo)"
      - "TwinState append-only bootstrap (no update()/delete() method on repository)"
      - "Threshold bootstrap formulas: max_hr = 220 - age, lt1 = 0.75 * max_hr, lt2 = 0.875 * max_hr"
      - "cp / vo2max / lt-power / lt-pace NULL at bootstrap"
      - "AthleteFitness aggregate = {0, 0, 0}; time_constants.source = population_default"
      - "TwinState.confidence_level = low; trigger = questionnaire; readiness_level = green"
      - "Metric confidence JSON: lt1_hr/lt2_hr = low; everything else null"
      - "structural_risk_flag = sport_background != RUNNING_PRIMARY"
      - "Data tier matches infer_data_tier(hr, power) for every documented combination"
      - "onboarding_completed payload: training_goal_id, twin_state_id, data_tier, confidence_level"
      - "ADR-006 explicit rollback before raising domain error after IntegrityError"
      - "require_self 403 (never 404) on cross-athlete access"
      - "PATCH immutability: profile fields date_of_birth / sex / timezone rejected with 422"
      - "PATCH preferences merges weekly_schedule at the day level (others untouched)"
