services:
  api:
    build: .
    container_name: pheidipp_api
    depends_on:
      - db
      - minio
      - litellm
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pheidipp
      RUNNING_IN_DOCKER: "true"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: pheidipp_db
    environment:
      POSTGRES_DB: pheidipp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-test-db.sh:/docker-entrypoint-initdb.d/create-test-db.sh
    ports:
      - "5432:5432"

  minio:
    image: minio/minio:latest
    container_name: pheidipp_minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: pheidipp_litellm
    working_dir: /app
    ports:
      - "4001:4000"   # host:4001 → container:4000 — avoids conflict with any existing Litellm on host:4000
    volumes:
      - ./litellm_proxy/pheidipp_litellm_config.yaml:/app/config.yaml:ro
      - ./litellm_proxy/callbacks.py:/app/callbacks.py
    env_file:
      - ./litellm_proxy/.env.litellm
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data: