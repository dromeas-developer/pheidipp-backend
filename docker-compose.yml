services:
  api:
    build: .
    container_name: pheidipp_api
    depends_on:
      - db
      - redis
      - litellm
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pheidipp
      RUNNING_IN_DOCKER: "true"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: pheidipp_db
    environment:
      POSTGRES_DB: pheidipp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/create-test-db.sh:/docker-entrypoint-initdb.d/create-test-db.sh
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    container_name: pheidipp_redis

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: pheidipp_litellm
    working_dir: /app
    ports:
      - "4001:4000"   # host:4001 → container:4000 — avoids conflict with any existing Litellm on host:4000
    volumes:
      - ./litellm_proxy/pheidipp_litellm_config.yaml:/app/config.yaml:ro
      - ./litellm_proxy/callbacks.py:/app/callbacks.py
    env_file:
      - ./litellm_proxy/.env.litellm
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    restart: unless-stopped

volumes:
  postgres_data: