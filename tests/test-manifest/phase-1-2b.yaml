coverage:
  events:
    covered: []
  invariants:
    covered:
      - "GoalType values are exactly race_event, target_performance, fitness_improvement, maintenance, recovery"
      - "GoalEventType values are exactly marathon, half_marathon, 10k, 5k, ultra, trail_race, custom"
      - "TrainingGoalStatus values are exactly active, completed, abandoned"
      - "InjurySeverity values are exactly minor, moderate, major"
      - "SecondaryEventPriority is bounded to {B, C}"
      - "TrainingPlanStatus is bounded to {active, superseded, completed}"
      - "PhaseLabel carries 20 canonical labels plus 3 legacy aliases"
      - "SessionType has exactly 16 values; race_specific is NOT a SessionType"
      - "SessionSlot is bounded to {am, pm}"
      - "SessionPriority is bounded to {primary, secondary}"
      - "PlannedSessionStatus is bounded to {pending, generated, completed, skipped, missed, redistributed}"
      - "WeeklyPlanStatus is bounded to {synthesised, active, completed}"
      - "CheckpointType is bounded to {calibration, benchmark, race_simulation, secondary_race, progress_review}"
      - "CheckpointStatus is bounded to {scheduled, completed, skipped}"
      - "ObjectiveCategory is bounded to the 9 closed ontology members"
      - "training_goals carries the full Phase-1.2b column set (goal definition + self-reported context + recovery context + target performance + status)"
      - "training_goals has the active-goal partial unique index WHERE status='active' (one active goal per athlete)"
      - "Two ACTIVE goals for the same athlete are rejected at the DB layer; ACTIVE+COMPLETED coexist via partial predicate"
      - "training_goals volume fields (weekly_volume_hours, weekly_volume_km) are non-negative at the DB layer"
      - "training_goals.fitness_level is bounded 1..5 at the DB layer"
      - "training_goals.custom_distance_km is NULL OR positive when set"
      - "training_goals.target_distance_km and target_time_minutes are NULL OR positive when set"
      - "training_goals has athlete_id FK CASCADE on athlete deletion"
      - "training_plans.training_goal_id FK CASCADES on goal deletion"
      - "training_plans.twin_state_id is a nullable UUID column WITHOUT a FK (deliberate — twin_states does not exist yet; Phase-1.2c adds the FK)"
      - "training_plans JSONB structural columns default to empty arrays / null"
      - "training_plans supersession is non-destructive (superseded_at + status='superseded' keeps the row; no deleted_at column)"
      - "secondary_events FK to training_goals CASCADES on goal deletion"
      - "regeneration_tasks FK to training_goals CASCADES on goal deletion"
      - "regeneration_tasks FK to training_plans SET-NULLs on plan deletion (task itself survives)"
      - "regeneration_tasks status is bounded to pending_confirmation|confirmed|declined|expired"
      - "regeneration_tasks has partial index ix_regeneration_tasks_pending WHERE status='pending_confirmation'"
      - "weekly_plans has UNIQUE (training_plan_id, week_number); duplicates rejected"
      - "weekly_plans FK to training_plans CASCADES on plan deletion"
      - "weekly_plans week_number >= 1 (zero and negative rejected); counters non-negative"
      - "weekly_sessions.planned_session_id is unique when non-null and null otherwise (no orphans)"
      - "weekly_sessions status inline-union bounded to {scheduled, completed, skipped, missed}; rejects other values"
      - "weekly_sessions block_position inline-union bounded to {first, middle, last}"
      - "weekly_sessions approximate_duration_minutes > 0 (zero and negative rejected)"
      - "planned_sessions has UNIQUE (weekly_plan_id, target_date, session_slot) — AM/PM disambiguation contract"
      - "planned_sessions.training_plan_id is the denormalised FK (staleness documented; queries join through WeeklyPlan)"
      - "planned_sessions.activity_id is a free-standing nullable UUID — NO FK to activities (deferred to a future migration)"
      - "planned_sessions FKs to weekly_plans and training_plans CASCADE on parent deletion"
      - "planned_sessions approximate_duration_minutes > 0; week_number >= 1"
      - "planned_sessions block_position bounded to {first, middle, last}"
      - "checkpoints has UNIQUE+NOT NULL planned_session_id (strict 1:1 with PlannedSession)"
      - "checkpoints has NO training_plan_id column — derivation via PlannedSession→WeeklyPlan→TrainingPlan"
      - "checkpoints FK to planned_sessions CASCADES on planned_session deletion"
      - "checkpoints status bounded to {scheduled, completed, skipped}; trajectory_status bounded to {ahead, on_track, behind, at_risk}"
      - "checkpoints.secondary_metrics is ARRAY(String); round-trip preserves multiple values"
      - "activities.planned_session_id remains a nullable UUID column"
      - "activities.planned_session_id now references planned_sessions.id with ondelete=SET NULL (Phase-1.2b wires the FK)"
      - "alembic upgrade head on a fresh database succeeds (rc=0)"
      - "alembic downgrade -1 returns schema to Phase-1.2a baseline (8 new tables gone; activities.planned_session_id FK removed)"
      - "Delivered Phase-1.2b migration revision equals 1b9e9026db1e (auditable via test_migration_file_present)"
      - "Migration down_revision chains from Phase-1.2a head (e7ffc8764335)"
      - "Upgrade and downgrade never drop Phase-1.1 / Phase-1.2a tables"
      - "All 8 Phase-1.2b tables created (training_goals, secondary_events, training_plans, regeneration_tasks, weekly_plans, weekly_sessions, planned_sessions, checkpoints)"
      - "ix_training_goals_athlete_active partial unique index emitted with predicate status='active'"
      - "ix_regeneration_tasks_pending partial index emitted with predicate status='pending_confirmation'"
      - "uq_weekly_plans_plan_week UNIQUE constraint emitted"
      - "uq_planned_sessions_plan_date_slot UNIQUE constraint emitted"
      - "checkpoints UNIQUE constraint on planned_session_id emitted (strict 1:1 invariant)"
      - "fk_activities_planned_session FK emitted with ondelete=SET NULL"
      - "training_plans.twin_state_id column emitted WITHOUT a FK (deliberate — deferred to Phase-1.2c)"
