coverage:
  events:
    covered:
      - "training_plan_generated (payload + outbox row in pending status)"
  invariants:
    covered:
      - "Pure-Python service — no LLM, no external API"
      - "Deterministic templates: phase proportions (40/30/15 + 2-week taper + 1-week race-week)"
      - "Training length gate (proceed / propose_intermediate / propose_shorter_goal)"
      - "One active plan per TrainingGoal — supersession replaces (not double-active)"
      - "Old plans never deleted — superseded_at is the only mutation"
      - "Phases non-overlapping, ordered, contiguous from plan_start to goal_event_date"
      - "PlannedSession rows cover full duration with no gaps"
      - "All PlannedSession rows start with status='scheduled'"
      - "All Checkpoint rows start with status='scheduled'"
      - "No consecutive quality sessions without block_id (per-week invariant)"
      - "Long run always followed by rest or recovery_run"
      - "Threshold / VO2max sessions sandwiched between easy/rest days"
      - "WeeklyPlan sessions array immutable (status=synthesised at plan-generation time)"
      - "One WeeklyPlan per (training_plan_id, week_number) — DB unique"
      - "PlannedSession.training_plan_id is denormalised — stale-aware queries join through WeeklyPlan"
      - "One Checkpoint per PlannedSession — DB-enforced 1:1"
      - "Checkpoint cannot be created retroactively — only at plan synthesis"
      - "strategic_rationale set only for race_event / target_performance modes"
      - "training_plan_generated event via transactional outbox inside the same DB transaction"
      - "require_self returns 403 on cross-athlete access (never 404)"
      - "Onboarding -> plan-generation atomicity: plan failure rolls onboarding back"
      - "Event payload: training_plan_id, training_goal_id, phase_definitions_count, total_weeks, supersedes_plan_id, trigger"
      - "Ordering: training_plan_generated fires only after athlete_registered and onboarding_completed"
