[pytest]
# Auto-mark async test functions so individual ``@pytest.mark.asyncio``
# decorators are not required. The project uses SQLAlchemy async via
# ``app.db.session.AsyncSessionLocal`` and pytest-asyncio for repository
# integration tests.
asyncio_mode = auto
# Bind every async test and async fixture to the same session-scoped
# event loop. ``tests/conftest.py`` opens the procrastinate app in a
# ``pytest_asyncio.fixture(scope="session", autouse=True, loop_scope="session")``
# so the ``PsycopgConnector`` async pool is created in the session loop
# and stays open for the whole run. Tests that run in the default
# function-scoped loop would then either hit
# ``ValueError: The future belongs to a different loop`` (when the test
# re-enters ``open_async()`` and tries to close the session-loop pool
# from the function loop) or deadlock with the pool's background
# ``check_connection`` task during table truncation in the
# ``db_session`` teardown. Setting
# ``asyncio_default_test_loop_scope = session`` makes the test loop
# match the fixture loop, eliminating both failure modes. Function-
# scoped async fixtures (``db_session``, ``client``) inherit the test
# loop and therefore also run in the session loop — they hold no
# independent loop state.
asyncio_default_test_loop_scope = session
testpaths = tests
pythonpath = .
