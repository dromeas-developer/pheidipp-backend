services:
  api:
    build: .
    container_name: pheidipp_api
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/pheidipp
      RUNNING_IN_DOCKER: "true"
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  db:
    image: timescale/timescaledb:latest-pg16
    container_name: pheidipp_db
    environment:
      POSTGRES_DB: pheidipp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: pheidipp_redis

volumes:
  postgres_data: