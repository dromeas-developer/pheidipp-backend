  phase-1-4-plan-repositories:
    status: promoted
    plan: "docs/implementation/phase-1/phase-1-4-p1-plan-generation.md"
    owned_by_plan:
      - "phase-1-4-p1-plan-generation"
    description: >-
      Three persistence abstractions for the plan hierarchy:
      TrainingPlanRepository (insert + supersede + get_active_for_*
      lookups), WeeklyPlanRepository + WeeklySessionRepository
      (bulk-insert + read paths), CheckpointRepository (bulk insert,
      get_for_training_plan joining through PlannedSession → WeeklyPlan).
    protects:
      - "TrainingPlanRepository.add persists the row inside the caller's transaction (flush, no commit)"
      - "TrainingPlanRepository.get_active_for_goal returns the latest active plan (or None)"
      - "TrainingPlanRepository.get_active_for_athlete joins through TrainingGoal to find the active plan"
      - "TrainingPlanRepository.supersede() mutates status to SUPERSEDED and stamps superseded_at, leaving the row in place"
      - "Superseded plans are never deleted — superseded_at is the only mutation"
      - "WeeklyPlanRepository.add_many persists all rows in one flush and refreshes each"
      - "WeeklyPlanRepository.get_for_training_plan orders by week_number ascending"
      - "WeeklyPlanRepository.get_by_plan_and_week returns the exact (plan_id, week_number) row"
      - "WeeklySessionRepository.add_many persists all sessions in one flush"
      - "CheckpointRepository.add_many persists all checkpoints in one flush"
      - "CheckpointRepository.get_for_training_plan joins through PlannedSession → WeeklyPlan and orders by target_date"
      - "CheckpointRepository.get_for_training_plan excludes checkpoints belonging to other plans"
    impacts:
      - "phase-1-2b-training-plan-schema"
      - "phase-1-2b-weekly-plan-schema"
      - "phase-1-2b-checkpoint-schema"
      - "phase-1-4-plan-generation-service"
    execution_prerequisites:
      migrations: false
      seed_data: false
      external_services: []
    validation:
