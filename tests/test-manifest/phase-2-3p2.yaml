    All 23 failures were test-pack issues, not implementation bugs. No infrastructure
    changes needed; the MOCKING_CONTRACT.md Known Anti-Patterns were extended with
    4 new entries matching the 4 failure classes.

    **Test-pack fixes (4 issues, 23 tests touched, 1 helper added, 0 tests removed):**
    1. **Integration `_state()` default date (16 tests)** — the integration test files''
    `_state()` helper defaulted `last_observation_date` to `"2026-05-01"` while the
    sibling `_observation()` helper defaulted `measurement_date=date(2026, 6, 15)`,
    creating a 45-day gap that decayed the prior weight via the 42-day time constant.
    The 2026-07-13 unit-test date-default lesson was correct but only fixed the 4
    unit tests that explicitly pinned the date; the integration tests relied on the
    helper''s default, so the default''s drift from the observation''s date was the
    single point of failure for 16 of 23 failures. Aligned the `_state()` default
    to `"2026-06-15"` in all 4 integration test files. 2. **Rollback fixture isolation
    (1 test)** — `test_event_atomicity_rolls_back_when_later_step_fails` created an
    `AthletePhysiology` row via `_create_physiology_row()` (flush-only) then called
    `apply_observations` then `rollback()`. The accumulation fix (RC2 production fix)
    made `apply_observations` actually mutate the row in place via `update_in_place`
    + `flag_modified`, which now flushes real SQL updates through the same session.
    The rollback unwound BOTH the fixture row''s INSERT AND the observation batch''s
    UPDATE, leaving no row at all. The post-rollback SELECT returned `[]` and `.scalars().all()[0]`
    raised `IndexError`. Committed the fixture row in its own transaction before the
    service call so it survives the subsequent rollback. 3. **Unit batch transition
    (1 test)** — `test_eight_observations_reach_high` expected `confidence_transitions["lt2_hr"]
    == ("medium", "high")` but the service reports a single batch `(pre_call_level,
    post_call_level)` transition per `apply_observations` call, not per-observation
    transitions. A single batch that starts at LOW (prior_weight 0.0) and ends at
    HIGH (prior_weight 8.0) reports a direct `LOW→HIGH` transition. Updated the expected
    to `("low", "high")` and added a doc comment explaining the batch-transition contract.
    4. **Behaviour pre-population + same-date activities (6 tests)** — the behaviour
    tests inserted empty `AthletePhysiology` rows (no `lt1`/`lt2` kwargs) and then
    called `apply_observations` with a single activity''s observations. The first
    observation for each parameter bootstrapped the state from null, and the shift
    detection''s `current_state is None` guard suppressed shift detection. The multi-activity
    tests were spread over multiple weeks (7-day gaps), so the 42-day decay reduced
    `prior_weight` to ~3.17 after 4 observations and ~4.79 after 8 observations —
    both below the 4.0 and 8.0 MEDIUM/HIGH thresholds. Added a `_state()` helper to
    the behaviour test file; pre-populated `lt1.hr` and `lt2.hr` in 3 single-activity
    shift tests with state that differs from the cleaned-stream observations by more
    than 1 bpm; pre-populated `lt2.hr` in 2 multi-activity tests with `prior_weight=0.5`
    and used same-date activities (distinct `activity_id` UUIDs, no decay); pre-populated
    `lt2.hr` in the small-shift test with a baseline posterior that differs from the
    observation by > 1 bpm.

    **No implementation bugs (routed to p-coder)** — both production bugs from the
    2026-07-13 triage pass were already resolved by p-coder before the 2026-07-14
    re-run: `_source_value()` enum `.value` fix at line 334-335 of `physiology_update_service.py`
    (all 7 previously failing tests now pass) and `apply_observations` intra-call
    state accumulation fix at lines 584-586 (cross-call accumulation was always correct;
    the fix is intra-call only).

    **Reusable failure classes recorded** — 4 new dated lessons added to `tests/README.md`
    under "Dated Lessons (2026-07-14, Phase-2.3-P2 test pack re-run)" and 4 new rows
    added to `tests/MOCKING_CONTRACT.md` "Known Anti-Patterns" table. The integration
    date-default rule extends the 2026-07-13 unit-test rule; the batch transition
    rule, rollback fixture-isolation rule, and behaviour pre-population rule are new
    failure classes that should be flagged in any future test-pack that exercises
    `apply_observations` or any other Bayesian service with a single-batch pre/post
    confidence transition.

    **Test count after this triage**: 77 tests in scope (1 unit + 5 integration +
    1 behaviour, plus the orchestrator''s helper file) collected cleanly via `bash
    scripts/pytest.sh --collect-only` in 0.15s. The full plan total of 193 tests is
    unchanged (no tests added or removed). No validation status change (all features
    remain at `validation.implemented = true` from prior generation; `validation.executable`
    and `validation.passed` remain DevOps-owned). The next DevOps run is expected
    to show 193 passed, 0 failed (modulo any pre-existing failures from other plans).

    `last_reviewed_at` bumped to 2026-07-14T12:00:00Z. '
