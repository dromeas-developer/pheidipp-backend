  coverage_delta: "DevOps report test pack re-run (2026-07-14, pass 3) — 1 of 193 tests still failed after p-test-architect resolved the 7 RC2 test-pack issues and the 1 RC3 post-rollback JSONB access issue from passes 1 and 2. The remaining failure is a refinement of the pass-2 RC3 post-rollback ORM access pattern: the column-level SELECT for `AthletePhysiology.lt2` was applied correctly, but the same hazard was present in the WHERE-clause references (`SystemEvent.athlete_id == athlete.id`, `PhysiologyMeasurement.athlete_id == athlete.id`, `AthletePhysiology.athlete_id == athlete.id` in the column-level SELECT WHERE clause), all of which access `athlete.id` AFTER `db_session.rollback()`. The pass-2 fix bypassed the ORM attribute layer for the freshly-loaded instance via column-level SELECT, but the in-memory `athlete` instance loaded BEFORE the rollback cannot be replaced by column-level SELECT because its PK is the WHERE-clause value. No infrastructure changes were made; the `expire_on_rollback=False` conftest fix was attempted by DevOps and reverted because SQLAlchemy 2.x does not support that parameter (raises `TypeError`). The fix is a per-test content change.\n\n**Test-pack fixes (1 issue, 1 test touched, 0 helpers added, 0 tests removed):** 1. **RC3 — Post-rollback PK access in WHERE clauses (1 test)** — `test_event_atomicity_rolls_back_when_later_step_fails` in `tests/integration/test_physiology_update_service_integration.py` passed the pass-2 column-level SELECT fix for the `fresh_lt2` JSONB read but failed on the next assertion: `select(SystemEvent).where(SystemEvent.athlete_id == athlete.id)` at line 878 triggered `sqlalchemy.exc.MissingGreenlet: greenlet_spawn has not been called; can't call await_only() here.` `db_session.rollback()` expires ALL ORM instances tracked by the session, including the `athlete` object loaded at the start of the test (line 835). Accessing `athlete.id` (or any other mapped attribute — even a PK) on an expired instance triggers an async lazy load to re-fetch the row. Under async SQLAlchemy + NullPool, the lazy load fires outside the greenlet context, raising `MissingGreenlet`. Fixed by capturing `athlete_id = athlete.id` as a plain Python UUID BEFORE the `rollback()` call, then replacing `athlete.id` with `athlete_id` in all 3 post-rollback WHERE clauses (`SystemEvent`, `PhysiologyMeasurement`, `AthletePhysiology.lt2` column-level SELECT). The captured `athlete_id` is a plain Python UUID, immune to the session-expiration hazard. Test fixed: `test_event_atomicity_rolls_back_when_later_step_fails`.\n\n**Reusable failure classes recorded** — 1 new dated lesson added to `tests/README.md` under \"Dated Lessons (2026-07-14, Phase-2.3-P2 test pack re-run, pass 2)\" (the same section as the pass-2 fix because the new lesson is a direct refinement of the pass-2 post-rollback ORM access pattern): \"Post-rollback PK access in WHERE clauses triggers `MissingGreenlet` — capture the PK before `rollback()`\". The new lesson is a strict superset of the 2026-07-11 `expire_all()` + lazy-load-on-captured-scalar rule: `rollback()` is a different state-setter than `expire_all()` (rollback evicts transaction state; expire_all evicts attribute state), but both leave the instance in a state where lazy loads are unservicable, and the capture-first pattern works for both. 1 new row added to `tests/MOCKING_CONTRACT.md` \"Known Anti-Patterns\" table cross-referencing the new README lesson, and a new change-log entry for 2026-07-14 pass 3 documenting the SQLAlchemy 2.x `expire_on_rollback` non-support finding. The \"session-state-change → async lazy load hazard\" failure class has now occurred 3 times across this plan and is flagged as a Recurring Infrastructure Risk in the test pack (recommended against moving to a shared conftest fixture at this time — the per-test capture pattern is one line, clearly named, and immediately visible to a reviewer; the marginal value of a fixture at 3 occurrences is small).\n\n**No implementation bugs (routed to p-coder)** — the implementation's behaviour in the RC3 scenario is correct: `apply_observations` correctly mutates the row, `db_session.rollback()` correctly unwinds the mutation, and no event/measurement/outbox/JSONB mutation persists. The test's post-rollback verification path was the defect — `athlete.id` access on an expired instance triggers an async lazy load that fires outside the greenlet context. The production code is not at fault.\n\n**No validation status change** — all 30 features in this sub-phase remain at `validation.implemented = true`, `validation.executable = true`, `validation.passed = false` (set by DevOps during the failed execution). The next DevOps run will re-execute and re-evaluate `executable` / `passed` based on the test-pack fixes. `last_reviewed_at` bumped to 2026-07-14T20:00:00Z.\n"

