  phase-1-4-onboarding-plan-integration:
    status: promoted
    plan: "docs/implementation/phase-1/phase-1-4-p1-plan-generation.md"
    owned_by_plan:
      - "phase-1-4-p1-plan-generation"
    description: >-
      OnboardingService integration with PlanGenerationService: when a
      PlanGenerationService is injected (via
      build_onboarding_service_with_plan), complete_onboarding invokes
      generate_plan at the end of the onboarding transaction. The plan
      service owns the final commit; a plan-generation failure rolls
      the whole transaction back so onboarding_complete stays False.
    protects:
      - "POST /athletes/{id}/onboarding returns 201 and lands an active plan after complete_onboarding"
      - "GET /plan returns the plan generated by onboarding without a second call"
      - "GET /plan/checkpoints exposes calibration + benchmark + progress_review checkpoints generated during onboarding"
      - "Onboarding failure rolls back plan-generation rollback — onboarding_complete stays False and no plan rows persist"
      - "Cross-athlete access to plan endpoints returns 403 (never 404)"
      - "A registered-but-not-onboarded athlete returns 404 on every plan endpoint"
    impacts:
