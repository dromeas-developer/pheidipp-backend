# ---------------------------------------------------------------------------
# Selection / execution-group membership.
#
# All Phase-1.1 features are status=promoted after the v3 clean pass
# (154/154 green in 25s, reports/phase-1-1-p1-p2-p3-email-password-auth_devops.md
# + reports/test_history/latest.md). Membership of each group was
# decided by the Test Architect alongside p-test-architect protocol
# Step 4 (selection groups):
#
# * smoke — pure-function unit tests only. No DB, no migrations, no
#   containers. Sub-second each. These guard the most-leveraged
#   primitives (bcrypt cost factor, JWT issue/verify hash & claim
#   shape, opaque refresh-token hashing, IP truncation, audit-log
#   allow/deny key contract). They are the cheapest tripwire for the
#   catastrophic regression classes: auth broken, secrets leaked.
# * feature — every Phase-1.1 test file (current feature scope).
# * regression — every Phase-1.1 test file. Authentication is a
#   non-optional security boundary; any Phase-1.1 test is a valid
#   signal that a future change broke the auth foundation.
# * release — same set as regression for this phase, since all
#   Phase-1.1 features are promoted. DevOps will pick this up when
#   running `execution_groups.release*`.
# ---------------------------------------------------------------------------

