coverage:
  routes: []
  events: []
  invariants:
    covered:
    - PhysiologyMeasurement is append-only
    - Threshold detection only runs for calibration_eligible = true activities
    - Threshold detection only runs for sport_type = RUNNING
    - Missing RawSensorStream returns empty list (signal cleaning not yet complete)
    - For athletes with RR intervals, training_rr_inflection observations have higher
      weight (2.5 vs 1.0)
    - For athletes with power, training_power_hr_ratio observations contribute to
      CP estimate
    - PhysiologyParameter closed ontology (10 values)
    - parameter and source stored as non-native String enums
    - algorithm_used and confidence_weight nullable for manual entries
    - 'Indexes: (athlete_id, measurement_date) and (athlete_id, parameter, source)'
    - activity_id ON DELETE SET NULL preserves the historical row when an Activity
      is deleted
    - athlete_id ON DELETE CASCADE removes measurements when the Athlete is deleted
    - Service does NOT write to PhysiologyMeasurement — that is Plan P2's responsibility
    - measurement_date on observations is activity.activity_date, not the detection
      runtime date
    - 'Natural training analysis: ≥3 consistent easy runs (±5 bpm) produce LT1_HR
      observation with weight 0.5'
    - Cleaned stream wire format round-trips through real object storage
    - 'End-to-end user journey: register → onboard → upload → signal_clean → threshold
      detection produces the documented observation contract'
    - 'Behaviour journey gates: calibration eligibility, sport type, missing RawSensorStream,
      cross-athlete guard'
    - 'Service boundary preserved end-to-end: detect() never writes to PhysiologyMeasurement
      across a full user journey'
    partial:
    - Easy runs are calibration-eligible for load computation but do NOT provide threshold
      detection evidence
