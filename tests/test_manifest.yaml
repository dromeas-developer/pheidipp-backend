    coverage_delta: "DevOps report (reports/phase-1-2a_devops.md) flagged two test-authoring errors blocking collection/execution. Fix 1: tests/unit/test_athlete_profile_columns.py — split the JSONB import out of the sqlalchemy core namespace into sqlalchemy.dialects.postgresql (the JSONB class is dialect-specific; importing it from sqlalchemy was raising ImportError at collection time, which also blocked 16 downstream integration assertions in tests/integration/test_athlete_profile_schema.py that depend on the same test module being collectible). Fix 2: tests/integration/test_migration_phase_1_2a.py — rewrote the _migration_function_body() regex to match the actual Alembic module-level signature ``def upgrade() -> None:`` / ``def downgrade() -> None:`` (the script.py.mako template emits these WITHOUT a self parameter). Old regex required ``\s*\(\s*self.*?\)\s*->\s*None:\s*:[^\n]*\n`` and so returned empty body for every upgrade/downgrade structural assertion; the new regex ``\(\s*(?:self)?\s*\)\s*(?:->\s*[^:]+)?:\s*\n`` accepts either module-level functions (the actual case) or class-based migrations (forward-compat) and tolerates any return annotation or none. Both fixes preserve the existing test count and assertion contract — they only widen the matching criteria. validation.executable and validation.passed intentionally LEFT UNCHANGED for phase-1-2a-athlete-profile-schema (executable=false, passed=false) and phase-1-2a-migration (executable=true, passed=false) because Test Architect has no execution evidence; DevOps owns these fields and must flip them on the next rerun. Schema-inspection failures (16 + 12 + 38 across test_athlete_profile_schema.py / test_athlete_preferences_schema.py / test_activity_schema.py) and the 1 partial-predicate unit failure in test_activity_columns.py are DEFERRED — they require root-cause investigation beyond the scope of this two-fix pass (likely conftest/inspector wiring rather than per-test authoring). No production files touched. last_reviewed_at bumped to 2026-06-20T12:00:00+00:00."
