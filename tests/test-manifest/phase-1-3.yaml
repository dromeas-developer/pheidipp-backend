features:
  phase-1-3-onboarding-service-transaction:
    status: promoted
    plan: "docs/implementation/phase-1/phase-1-3-p1-onboarding-twin-bootstrap.md"
    owned_by_plan:
      - "phase-1-3-p1-onboarding-twin-bootstrap"
    description: >-
      OnboardingService.complete_onboarding owns the atomic write sequence
      that creates AthletePreferences, TrainingGoal, AthletePhysiology,
      AthleteFitness, TwinState, flips onboarding_complete, and persists
      onboarding_completed via the outbox in one transaction.
    protects:
      - "complete_onboarding writes Athlete + AthleteProfile enrichment + AthletePreferences + TrainingGoal + AthletePhysiology + AthleteFitness + TwinState in one transaction"
      - "Exactly one row of each persisted entity per athlete"
      - "onboarding_complete flips to True only at the end of the transaction"
      - "HR-only athletes land at Tier 3; power+RR -> Tier 1; coverage for every infer_data_tier input pair"
      - "lt1_hr / lt2_hr / max_hr thresholds derived from date_of_birth via max_hr = 220 - age, lt1 = 0.75 * max_hr, lt2 = 0.875 * max_hr"
      - "cp and vo2max stay NULL at bootstrap (never estimated from questionnaire)"
      - "lt1_power / lt1_pace / lt2_power / lt2_pace stay NULL at bootstrap"
      - "TwinState.fitness / fatigue / form = 0.0; aggregate def satisfies form = fitness - fatigue"
      - "AthleteFitness time_constants.source = population_default; documented tau values for aerobic/neuromuscular/structural"
      - "aerobic / neuromuscular / structural dimensional blocks NULL at bootstrap"
      - "TwinState.confidence_level = low, trigger = questionnaire, model_version = v1-questionnaire-bootstrap"
      - "TwinState.readiness_level = green; activity_id = NULL; wellness_trend = NULL"
      - "Metric confidence JSON carries lt1_hr/lt2_hr = 'low' and lt1_power/lt1_pace/lt2_power/lt2_pace/cp = null"
      - "structural_risk_flag computed server-side as sport_background != RUNNING_PRIMARY"
      - "Goal-type whitelist enforced at the service: only race_event | target_performance; the other three GoalType values reject 422"
      - "Timezone is validated against zoneinfo at the OnboardingProfileIn schema (422 on invalid IANA)"
      - "onboarding_completed payload contains training_goal_id (UUID), twin_state_id (UUID), data_tier (int 1..6), confidence_level = 'low'"
      - "SystemEventOutbox row inserted with status = PENDING (paired with the SystemEvent row) in the same transaction"
      - "Pure Python bootstrap — no LLM, no external API"
      - "Re-onboarding raises OnboardingAlreadyCompleteError (HTTP 409) and writes nothing"
      - "Missing athlete raises AthleteNotFoundError (HTTP 404)"
      - "Service-level IntegrityError on active-goal partial unique index is caught, session.rollback() is invoked (ADR-006), then TrainingGoalConflictError is raised (HTTP 409)"
      - "Mid-transaction failure rolls back every entity; no orphan rows persist"
    impacts:
      - "phase-1-2c-twin-state-schema"
      - "phase-1-2c-athlete-physiology-schema"
      - "phase-1-2c-athlete-fitness-schema"
      - "phase-1-2b-training-goal-schema"
      - "phase-1-2a-athlete-preferences-schema"
      - "phase-1-2a-athlete-profile-schema"
      - "phase-1-1-registration-regression"
    execution_prerequisites:
      migrations: false
      seed_data: false
      external_services: []
    validation:
      implemented: true
      executable: true
      passed: true
    tests:
      unit:
        - path: "tests/unit/test_onboarding_service.py"
          owner: "phase-1-3-p1-onboarding-twin-bootstrap"
        - path: "tests/unit/test_onboarding_errors.py"
          owner: "phase-1-3-p1-onboarding-twin-bootstrap"
      integration:
        - path: "tests/integration/test_onboarding_service.py"
          owner: "phase-1-3-p1-onboarding-twin-bootstrap"
      api:
        - path: "tests/api/test_onboarding_endpoints.py"
          owner: "phase-1-3-p1-onboarding-twin-bootstrap"
      behaviour:
        - path: "tests/behaviour/test_onboarding_user_journey.py"
          owner: "phase-1-3-p1-onboarding-twin-bootstrap"
      release: []

  phase-1-3-onboarding-endpoints:
    status: promoted
    plan: "docs/implementation/phase-1/phase-1-3-p1-onboarding-twin-bootstrap.md"
    owned_by_plan:
      - "phase-1-3-p1-onboarding-twin-bootstrap"
    description: >-
      Eight HTTP endpoints mounted under /athletes/{id} on
      onboarding_router — POST/GET /onboarding, GET/PATCH /profile,
      GET/PATCH /preferences, GET /twin and GET /twin/history. Every
      endpoint enforces require_self; cross-athlete access returns 403.
    protects:
      - "POST /athletes/{id}/onboarding returns 201 with twin_state_id, training_goal_id, data_tier, confidence_level, created_at"
      - "POST /athletes/{id}/onboarding returns 409 when onboarding_complete is already True (idempotency guard)"
      - "POST /athletes/{id}/onboarding inline-validates timezone (422), goal-type whitelist (422), goal-event required fields (422)"
      - "POST /athletes/{id}/onboarding inline-validates weekly_schedule 7-day shape (422 on missing/extra days)"
      - "GET /athletes/{id}/onboarding returns the per-entity existence flags whether or not onboarding has run"
      - "GET /athletes/{id}/profile returns 200 (Phase-1.1 minimal profile) post-registration; never excludes personalisation model JSONBs"
      - "PATCH /athletes/{id}/profile accepts only height_cm / location_lat / location_lng / training_window"
      - "PATCH /athletes/{id}/profile rejects date_of_birth / sex / timezone with 422"
      - "PATCH /athletes/{id}/profile rejects extra fields (extra='forbid') with 422"
      - "GET /athletes/{id}/preferences returns 404 until onboarding has run; 200 with the full schedule afterwards"
      - "PATCH /athletes/{id}/preferences merges weekly_schedule at the day level; top-level fields overwrite"
      - "PATCH /athletes/{id}/preferences returns 404 before onboarding completes"
      - "GET /athletes/{id}/twin returns 200 with the latest TwinState after onboarding; 404 before"
      - "GET /athletes/{id}/twin/history returns array of TwinState rows newest-first, bounded by ?limit (max 100)"
      - "GET /athletes/{id}/twin/history validates ?limit with ge=1 and le=100"
      - "Every endpoint requires require_self; cross-athlete access returns 403 (never 404)"
      - "Every endpoint returns 401 on missing/malformed Bearer; 403 on athlete mismatch (401 != 403 distinction preserved)"
      - "Response bodies never contain hashed_password, token_hash, provider_tokens, or provider_user_id anywhere"
      - "PATCH /preferences and /profile are idempotent"
    impacts:
      - "phase-1-3-onboarding-service-transaction"
      - "phase-1-1-require-self-dependency"
    execution_prerequisites:
      migrations: false
      seed_data: false
      external_services: []
    validation:
      implemented: true
      executable: true
      passed: true
    tests:
      unit: []
      integration: []
      api:
        - path: "tests/api/test_onboarding_endpoints.py"
          owner: "phase-1-3-p1-onboarding-twin-bootstrap"
      behaviour:
        - path: "tests/behaviour/test_onboarding_user_journey.py"
          owner: "phase-1-3-p1-onboarding-twin-bootstrap"
      release: []

  phase-1-3-domain-error-mapping:
    status: generated
    plan: "docs/implementation/phase-1/phase-1-3-p1-onboarding-twin-bootstrap.md"
    owned_by_plan:
      - "phase-1-3-p1-onboarding-twin-bootstrap"
    description: >-
      Domain exception surface for the onboarding API: five error classes
      (OnboardingAlreadyCompleteError, AthleteNotFoundError,
      OnboardingIncompleteError, TrainingGoalConflictError,
      InvalidGoalTypeError) all deriving from OnboardingError. The router
      maps each to a stable HTTP status code.
    protects:
      - "OnboardingError is the common base class for all five exceptions"
      - "OnboardingAlreadyCompleteError -> 409"
      - "TrainingGoalConflictError      -> 409 (distinct mapping from OnboardingAlreadyCompleteError)"
      - "AthleteNotFoundError           -> 404"
      - "OnboardingIncompleteError      -> 404 (read endpoints only; service raises it for unresolved reads)"
      - "InvalidGoalTypeError           -> 422"
      - "The five subclasses are identity-distinct — none collapse into another"
      - "Each error class accepts a detail message and exposes it via str()"
    impacts:
      - "phase-1-3-onboarding-service-transaction"
      - "phase-1-3-onboarding-endpoints"
    execution_prerequisites:
      migrations: false
      seed_data: false
      external_services: []
    validation:
      implemented: true
      executable: true
      passed: true
    tests:
      unit:
        - path: "tests/unit/test_onboarding_errors.py"
          owner: "phase-1-3-p1-onboarding-twin-bootstrap"
      integration: []
      api:
        - path: "tests/api/test_onboarding_endpoints.py"
          owner: "phase-1-3-p1-onboarding-twin-bootstrap"
      behaviour: []
      release: []

