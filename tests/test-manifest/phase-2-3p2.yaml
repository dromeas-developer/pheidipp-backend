    \ `test_four_rr_observations_reach_high_confidence`.\n3. **RC3 — Post-rollback\
    \ ORM attribute access (1 test)** —\n   `test_event_atomicity_rolls_back_when_later_step_fails`\n\
    \   passed the pass-1 fix (committing the fixture row in its\n   own transaction)\
    \ but the post-rollback assertion\n   `fresh.lt2[\"hr\"][\"value\"]` triggered\
