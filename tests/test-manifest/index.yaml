coverage:
  routes:
    covered:
    - POST /athletes/{id}/coach/first-message
    - GET /athletes/{id}/coach/messages
    - GET /athletes/{id}/today
    - POST /athletes/{id}/sessions/{sid}/generate-workout
    - POST /athletes/{id}/activities/upload
    - GET /athletes/{id}/activities
    - GET /athletes/{id}/activities/{aid}
    - POST /athletes/{id}/activities/{aid}/analyse
    - GET /athletes/{id}/activities/{aid}/analysis
    partial: []
    missing: []
  events:
    covered:
    - coaching_message_generated
    - workout_generated
    - activity_ingested
    - activity_calibration_eligible
    - physiology_updated
    - twin_recalibrated
    - twin_confidence_upgraded
    partial: []
    missing: []
  invariants:
    covered:
    - first_message — only one per athlete
    - Every CoachingMessage has a corresponding GenerationEvent
    - GenerationEvent.failure_reason non-null when success=false
    - Messages are immutable
    - Append-only repositories
    - WorkoutStep.physiological_intent is never null
    - GeneratedWorkout idempotent for (planned_session_id, generation_date)
    - theoretical_targets and adjusted_targets both always written
    - Target type depends on data tier (power/gap/description)
    - Steps never updated after creation — append-only
    - warmup step first, cooldown step last
    - Object storage upload BEFORE Activity record creation
    - fit_file_key always set for source != manual_entry
    - Load scores null at initial creation, populated by LoadComputationService
    - TwinState append-only
    - PostWorkoutAgent idempotent (second call returns existing message)
    - Every LLM call writes GenerationEvent
    - activity_ingested event published AFTER commit
    - POST /upload returns 202 with task_id
    - calibration_eligible set by CalibrationEligibilityService and never manually overridden
    - Signal availability flags (has_power, has_rr_intervals, has_gps) set during ingestion pipeline
    - Tier 5-6 activities are never calibration-eligible
    - Power-based aerobic load for Tier 1-2 athletes
    - Neuromuscular load computed for Tier 1-4 athletes
    - Structural load computed from GPS data
    - Activity.cleaning_pipeline_version null → non-null exclusively by cleaning task
    - One RawSensorStream per Activity
    - Cleaned data stored in object storage is immutable
    - fit_file_key on RawSensorStream is the cleaned stream key — different from Activity.fit_file_key
    - Steps run in fixed order 1→7. No step may be skipped or reordered
    - Signal cleaning failure does not block Activity creation
    - Activities with source = manual_entry never get RawSensorStream
    - If the pipeline produces a stream shorter than 5 minutes of non-null HR data, RawSensorStream is not created
    - 'available_channels reflects what survived artifact removal (unit: >80% null → false tests; integration: persisted JSONB
      shape; behaviour Journeys E/F pending FIT fixture for end-to-end assertion)'
    - PhysiologyMeasurement is append-only at the repository layer — no update/delete methods
    - activity_id ON DELETE SET NULL preserves the historical row when an Activity is deleted
    - athlete_id ON DELETE CASCADE removes measurements when the Athlete is deleted
    - Threshold detection only runs for calibration_eligible = true activities (end-to-end)
    - Threshold detection only runs for sport_type = RUNNING (end-to-end)
    - Missing RawSensorStream returns empty list (end-to-end)
    - detect() does NOT write to PhysiologyMeasurement — that is Plan P2's responsibility
    - Natural training analysis: ≥3 consistent easy runs (±5 bpm) produce LT1_HR observation with weight 0.5
    - Natural training analysis: inconsistent easy runs (spread > 5 bpm) produce no observation
    - Natural training analysis: fewer than 3 easy runs produce no observation
    - Natural training analysis: measurement_date is the current activity's activity_date, not the historical run dates
    - physiology_updated event atomicity — SystemEvent + SystemEventOutbox land in the SAME transaction as the AthletePhysiology
      update (ADR-004)
    - One AthletePhysiology row per athlete — the row id is preserved across update_in_place (no second row created)
    - Confidence is monotonic (only increases, never decreases) — the prior_weight decays over time, but the per-metric level
      (LOW/MEDIUM/HIGH) ratchets up only
    - Per-metric confidence ratchet (ADR-011) — a metric that previously reached MEDIUM stays MEDIUM even if prior_weight
      has decayed below 4.0; None previous means "no data" (not "low confidence"), so computed wins
    - Calibration TwinState trigger — a calibration TwinState can coexist with a prior activity_sync TwinState
      for the same activity (dual-trigger scenario); a prior calibration TwinState supersedes everything
    - twin_recalibrated event — fires for every new calibration TwinState (no threshold gate, unlike physiology_updated)
    - twin_confidence_upgraded event — fires only when confidence_level strictly increases
    - threshold_detection worker task — orchestrates detect → apply_observations → recalibrate_for_calibration →
      commit in a single transaction (ADR-009 decoupling)
    - signal_clean → threshold_detection defer — fires AFTER signal_clean commit, swallowed on failure
    partial: []
    missing: []
cross_phase_dependencies:
  phase-2-3-p3-twin-recalibration-pipeline:
  - phase-2-2-p1-signal-cleaning
  - phase-2-3-p1-threshold-detection
  - phase-2-3-p2-physiology-update
  description: The Phase 2.3 P3 twin recalibration pipeline depends on the
    signal cleaning pipeline (Phase 2.2 P1) for the RawSensorStream
    contract, the threshold detection service (Phase 2.3 P1) for the
    ThresholdObservation data shape, and the physiology update service
    (Phase 2.3 P2) for the PhysiologyUpdateResult data shape. The
    tests for this plan use the same factory helpers and signal-cleaning
    integration patterns as those plans.
