    - phase-2-3-p3-twin-recalibration-pipeline
    description: '_max_confidence_level() returns the higher of two TwinConfidenceLevel
      values — the global ratchet that prevents confidence_level from ever decreasing.

      '
    protects:
    - Returns a when a is higher
    - Returns b when b is higher
    - Returns the same value when both equal
    - Monotonicity invariant preserved for all combinations
